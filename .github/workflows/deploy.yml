# Deploy to the production server over SSH: pull main there, build the images on the server, restart.
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   Secrets:   SSH_HOST        server address
#              SSH_USER        deploy user (must be in the docker group)
#              SSH_PASSWORD    password for that user
#              SSH_PORT        optional, default 22
#              DEPLOY_PATH     optional, default /opt/agristack
#
# One-time on the server: create .env in DEPLOY_PATH (see deployment.md) and point your Caddy site at
# 127.0.0.1:7004. The first deploy runs the setup service (database, boundaries, seed data, knowledge base)
# and leaves /state/.setup-done so later deploys skip it.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional: runs the Telegram bot when set
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,REPO_URL,TG_TOKEN
          command_timeout: 60m    # image builds run on the server
          script: |
            set -e
            mkdir -p "${DEPLOY_PATH:-/opt/agristack}"
            cd "${DEPLOY_PATH:-/opt/agristack}"
            [ -d .git ] || git init -q   # first deploy into a plain folder (e.g. one holding only .env)
            git fetch -q "$REPO_URL" main
            git reset --hard FETCH_HEAD   # compose file, nginx.conf; .env is untracked
            echo "Deploying in $(pwd)"
            [ -f .env ] || { echo "No .env in $(pwd): create it from .env.example"; exit 1; }
            # Presentation site: switch demo mode on unless .env already says DEMO_MODE (set DEMO_MODE=0 there to turn
            # it off; this line then leaves it alone). Remove this step before real users join.
            grep -q '^DEMO_MODE=' .env || printf '\nDEMO_MODE=1\n' >> .env
            # Telegram bot: the TELEGRAM_BOT_TOKEN repository secret goes into .env (never printed), and the bot
            # service (compose profile "telegram") is built and started with the others.
            if [ -n "$TG_TOKEN" ]; then
              sed -i '/^TELEGRAM_BOT_TOKEN=/d' .env
              printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TG_TOKEN" >> .env
            fi
            if grep -q '^TELEGRAM_BOT_TOKEN=.' .env; then export COMPOSE_PROFILES=telegram; echo "Telegram bot: on"; else echo "Telegram bot: off (no token)"; fi
            docker compose build api disease web   # api's image is shared by forecast, sync and telegram
            # First deploy only: create the database and load reference data (marker file on the state volume).
            if ! docker compose run --rm --no-deps --entrypoint sh api -c 'test -f /state/.setup-done'; then
              docker compose --profile setup run --rm setup
              docker compose run --rm --no-deps --entrypoint sh api -c 'touch /state/.setup-done'
            fi
            docker compose up -d --remove-orphans
            docker image prune -f
            # Wait up to 3 minutes for the API to answer through the web container's nginx.
            for i in $(seq 36); do
              if curl -fsS -o /dev/null http://127.0.0.1:7004/api/docs; then break; fi
              if [ "$i" = 36 ]; then docker compose ps; docker compose logs --tail 80 api; exit 1; fi
              sleep 5
            done
            # Load the disease model now (the first photo check is then fast) and show whether it loads.
            docker compose exec -T disease python -c "import urllib.request; print('disease model:', urllib.request.urlopen('http://localhost:7003/health?load=true', timeout=300).read().decode())" || echo "disease model: health check failed"
            # Demo site only: DEMO_MODE=1 in .env seeds the demo accounts and data once.
            if grep -q '^DEMO_MODE=1' .env && \
               ! docker compose run --rm --no-deps --entrypoint sh api -c 'test -f /state/.demo-seeded'; then
              docker compose --profile demo run --rm demo
              docker compose run --rm --no-deps --entrypoint sh api -c 'touch /state/.demo-seeded'
            fi
            # Demo site: refresh the MoA product rates and the sample shops once per data version (safe to re-run;
            # never overwrites a price a dealer entered). Bump the version when scripts/presentation_data.py changes.
            PRES=/state/.presentation-v6
            if grep -q '^DEMO_MODE=1' .env && \
               ! docker compose run --rm --no-deps --entrypoint sh api -c "test -f $PRES"; then
              docker compose --profile demo run --rm --no-deps demo python scripts/presentation_data.py   # via the entrypoint: /state links
              docker compose run --rm --no-deps --entrypoint sh api -c "touch $PRES"
            fi
            docker compose ps
