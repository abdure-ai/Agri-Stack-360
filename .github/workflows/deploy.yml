# Build the images, push them to GitHub Container Registry, then deploy to the production server over SSH.
#
# Repository settings needed (Settings -> Secrets and variables -> Actions):
#   Variables: DOMAIN          public host name, e.g. agristack.example (baked into the web build)
#   Secrets:   SSH_HOST        server address
#              SSH_USER        deploy user (must be in the docker group)
#              SSH_KEY         private key for that user
#              SSH_PORT        optional, default 22
#              DEPLOY_PATH     optional, default /opt/agristack
#              GHCR_PULL_TOKEN a personal access token with read:packages (the server uses it to pull)
#
# One-time on the server: clone the repo to DEPLOY_PATH, create .env (see deployment.md), and run
#   docker compose --profile setup run --rm setup
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: App image (api, forecast, sync, telegram)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.app
          push: true
          tags: |
            ${{ env.REGISTRY }}agristack-app:latest
            ${{ env.REGISTRY }}agristack-app:${{ github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Disease model image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.disease
          push: true
          tags: |
            ${{ env.REGISTRY }}agristack-disease:latest
            ${{ env.REGISTRY }}agristack-disease:${{ github.sha }}
          cache-from: type=gha,scope=disease
          cache-to: type=gha,mode=max,scope=disease

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: PUBLIC_URL=https://${{ vars.DOMAIN }}
          tags: |
            ${{ env.REGISTRY }}agristack-web:latest
            ${{ env.REGISTRY }}agristack-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,REGISTRY,TAG,DEPLOY_PATH
          script_stop: true
          script: |
            cd "${DEPLOY_PATH:-/opt/agristack}"
            git fetch origin main && git reset --hard origin/main   # compose file, Caddyfile; .env is untracked
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export REGISTRY TAG
            docker compose pull api forecast sync disease web
            docker compose up -d --remove-orphans --no-build
            docker image prune -f
            sleep 20
            docker compose ps
            curl -fsS -o /dev/null "https://$(grep -E '^DOMAIN=' .env | cut -d= -f2 | tr -d ' ')/api/docs"
