# Inside the container: plain HTTP. TLS is terminated by the reverse proxy in front (e.g. Caddy).
server {
    listen 7004;
    root /usr/share/nginx/html;

    # Compress text files: the woreda boundaries (geo/eth_adm3.json) drop from 1.8 MB to about 0.5 MB.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    location /geo/      { expires 7d; add_header Cache-Control "public"; }   # boundary files change rarely
    location /          { try_files $uri /index.html; }
    location = /sw.js   { add_header Cache-Control "no-cache"; }

    location /api/      { proxy_pass http://api:7000; client_max_body_size 12m; proxy_read_timeout 90s;
                          proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
    location /forecast/ { proxy_pass http://forecast:7001/; }
    location /sync/     { proxy_pass http://sync:7002/sync/; }
}
