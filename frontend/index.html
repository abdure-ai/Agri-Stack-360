<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f8a57" />
    <meta
      name="description"
      content="Agri-Stack 360 — market prices, forecasts, crop health and farm finance for Ethiopian agriculture."
    />
    <title>Agri-Stack 360</title>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
