<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agri-Stack 360 | AI agricultural intelligence for Ethiopian farmers</title>
    <meta
      name="description"
      content="Know what's wrong with your crop, what to do, where to buy a genuine input, and when to sell. In Amharic, Afaan Oromoo, Tigrinya and English."
    />
    <meta name="theme-color" content="#155a3a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Link previews (Telegram, LinkedIn, WhatsApp) read these without running the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agri-Stack 360" />
    <meta property="og:url" content="https://agristack.debbal.com/" />
    <meta property="og:title" content="Agri-Stack 360: AI agricultural intelligence for Ethiopian farmers" />
    <meta
      property="og:description"
      content="Crop disease detection, cited advice from Ministry of Agriculture guidelines, genuine inputs and market prices. In Amharic, Afaan Oromoo, Tigrinya and English."
    />
    <meta property="og:image" content="https://agristack.debbal.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Agri-Stack 360: AI agricultural intelligence for Ethiopian farmers" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without holding up the first paint (system font until they arrive; phones on mobile data). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Noto+Sans+Ethiopic:wght@400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Noto+Sans+Ethiopic:wght@400..700&display=swap"
      />
    </noscript>
    <script>
      // Apply the saved theme before first paint to avoid a light flash in dark mode.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body class="dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
